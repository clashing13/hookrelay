[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "hookrelay"
version = "0.1.0"
description = "A fault-tolerant webhook delivery platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Tarun Athreya", email = "98635360+clashing13@users.noreply.github.com" },
]
dependencies = [
  "alembic>=1.18.5,<2",
  "asyncpg>=0.30,<1",
  "fastapi==0.141.1",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "uvicorn>=0.52,<1",
]

[project.scripts]
hookrelay = "hookrelay.main:run"

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "httpx2>=2.9.1,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hookrelay"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "asgi_lifespan.*"
ignore_missing_imports = true
