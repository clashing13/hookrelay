name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, migrate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: "1"
      HOOKRELAY_ENVIRONMENT: test
      HOOKRELAY_DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay-ci-only@127.0.0.1:5432/hookrelay_test
      HOOKRELAY_TEST_DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay-ci-only@127.0.0.1:5432/hookrelay_test

    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_DB: hookrelay_test
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username hookrelay --dbname hookrelay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.13

      - name: Install uv 0.12.1
        run: python -m pip install --disable-pip-version-check uv==0.12.1

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Run unit and API tests
        run: uv run pytest -m "not integration"

      - name: Validate and apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Validate migration downgrade and re-upgrade
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: uv run pytest -m "integration and not concurrency"

      - name: Run PostgreSQL concurrency tests
        run: uv run pytest -m concurrency

      - name: Check model and migration alignment
        run: uv run alembic check

      - name: Validate Compose and build the image
        run: |
          docker compose config --quiet
          docker build --pull --tag hookrelay:ci .
