name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, migrate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: "1"
      HOOKRELAY_ENVIRONMENT: test
      HOOKRELAY_DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay-ci-only@127.0.0.1:5432/hookrelay_test
      HOOKRELAY_TEST_DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay-ci-only@127.0.0.1:5432/hookrelay_test
      HOOKRELAY_NATS_URL: nats://127.0.0.1:4222
      HOOKRELAY_TEST_NATS_URL: nats://127.0.0.1:4222

    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_DB: hookrelay_test
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username hookrelay --dbname hookrelay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.13

      - name: Start NATS 2.14.3 with file-backed JetStream
        run: |
          docker run --detach --name hookrelay-ci-nats \
            --publish 4222:4222 --publish 8222:8222 \
            nats:2.14.3-alpine3.22 -js -sd /data -m 8222
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs hookrelay-ci-nats
          exit 1

      - name: Install uv 0.12.1
        run: python -m pip install --disable-pip-version-check uv==0.12.1

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Run unit and API tests
        run: uv run pytest -m "not integration"

      - name: Validate and apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Validate migration downgrade and re-upgrade
        run: |
          uv run alembic downgrade 20260802_0001
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: uv run pytest -m "integration and not concurrency"

      - name: Run PostgreSQL concurrency tests
        run: uv run pytest -m concurrency

      - name: Check model and migration alignment
        run: uv run alembic check

      - name: Validate Compose and build the image
        run: |
          docker compose config --quiet
          docker build --pull --tag hookrelay-api:stage5 .

      - name: Verify the least-privilege application runtime
        run: >-
          docker compose run --rm --no-deps --entrypoint python api -c
          "import os, pathlib;
          status = dict(line.rstrip().split(':', 1) for line in open('/proc/self/status'));
          root_options = next(line.split()[3] for line in open('/proc/mounts') if line.split()[1] == '/');
          pids_max = pathlib.Path('/sys/fs/cgroup/pids.max');
          assert os.getuid() == 10001 and os.getgid() == 10001;
          assert status['CapEff'].strip() == '0000000000000000';
          assert status['NoNewPrivs'].strip() == '1';
          assert 'ro' in root_options.split(',');
          assert not pids_max.exists() or pids_max.read_text().strip() == '256';
          pathlib.Path('/tmp/hookrelay-ci-write-check').write_text('ok')"

      - name: Show NATS logs on failure
        if: failure()
        run: docker logs hookrelay-ci-nats
