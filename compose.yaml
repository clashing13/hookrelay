name: hookrelay

x-hookrelay-image: &hookrelay-image
  image: hookrelay-api:stage6
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777

x-hookrelay-runtime-environment: &hookrelay-runtime-environment
  HOOKRELAY_ENVIRONMENT: local
  HOOKRELAY_LOG_LEVEL: ${HOOKRELAY_LOG_LEVEL:-INFO}
  HOOKRELAY_TELEMETRY_ENABLED: ${HOOKRELAY_TELEMETRY_ENABLED:-false}
  HOOKRELAY_OTEL_EXPORTER_OTLP_ENDPOINT: ${HOOKRELAY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
  HOOKRELAY_OTEL_EXPORT_TIMEOUT_SECONDS: ${HOOKRELAY_OTEL_EXPORT_TIMEOUT_SECONDS:-2}
  HOOKRELAY_METRICS_ENABLED: ${HOOKRELAY_METRICS_ENABLED:-true}
  HOOKRELAY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hookrelay}:${POSTGRES_PASSWORD:-hookrelay-dev-only}@postgres:5432/${POSTGRES_DB:-hookrelay}
  HOOKRELAY_DATABASE_POOL_SIZE: ${HOOKRELAY_DATABASE_POOL_SIZE:-5}
  HOOKRELAY_DATABASE_MAX_OVERFLOW: ${HOOKRELAY_DATABASE_MAX_OVERFLOW:-10}
  HOOKRELAY_READINESS_TIMEOUT_SECONDS: ${HOOKRELAY_READINESS_TIMEOUT_SECONDS:-2}
  HOOKRELAY_MAX_REQUEST_BODY_BYTES: ${HOOKRELAY_MAX_REQUEST_BODY_BYTES:-1048576}
  HOOKRELAY_MAX_EVENT_PAYLOAD_BYTES: ${HOOKRELAY_MAX_EVENT_PAYLOAD_BYTES:-262144}
  HOOKRELAY_SECRET_ENCRYPTION_KEY: ${HOOKRELAY_SECRET_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
  HOOKRELAY_SECRET_ENCRYPTION_KEY_VERSION: ${HOOKRELAY_SECRET_ENCRYPTION_KEY_VERSION:-1}
  HOOKRELAY_NATS_URL: nats://nats:4222
  HOOKRELAY_NATS_STREAM_NAME: ${HOOKRELAY_NATS_STREAM_NAME:-HOOKRELAY_DELIVERIES_V1}
  HOOKRELAY_NATS_SUBJECT: ${HOOKRELAY_NATS_SUBJECT:-hookrelay.delivery.requested.v1}
  HOOKRELAY_NATS_CONSUMER_NAME: ${HOOKRELAY_NATS_CONSUMER_NAME:-HOOKRELAY_DELIVERY_WORKERS_V1}
  HOOKRELAY_NATS_CONNECT_TIMEOUT_SECONDS: ${HOOKRELAY_NATS_CONNECT_TIMEOUT_SECONDS:-2}
  HOOKRELAY_NATS_DRAIN_TIMEOUT_SECONDS: ${HOOKRELAY_NATS_DRAIN_TIMEOUT_SECONDS:-5}
  HOOKRELAY_NATS_PUBLISH_TIMEOUT_SECONDS: ${HOOKRELAY_NATS_PUBLISH_TIMEOUT_SECONDS:-2}
  HOOKRELAY_NATS_DUPLICATE_WINDOW_SECONDS: ${HOOKRELAY_NATS_DUPLICATE_WINDOW_SECONDS:-600}
  HOOKRELAY_NATS_STREAM_MAX_BYTES: ${HOOKRELAY_NATS_STREAM_MAX_BYTES:-1073741824}
  HOOKRELAY_NATS_ACK_WAIT_SECONDS: ${HOOKRELAY_NATS_ACK_WAIT_SECONDS:-30}
  HOOKRELAY_NATS_ACK_TIMEOUT_SECONDS: ${HOOKRELAY_NATS_ACK_TIMEOUT_SECONDS:-2}
  HOOKRELAY_NATS_MAX_ACK_PENDING: ${HOOKRELAY_NATS_MAX_ACK_PENDING:-32}
  HOOKRELAY_OUTBOX_BATCH_SIZE: ${HOOKRELAY_OUTBOX_BATCH_SIZE:-25}
  HOOKRELAY_OUTBOX_POLL_INTERVAL_SECONDS: ${HOOKRELAY_OUTBOX_POLL_INTERVAL_SECONDS:-0.25}
  HOOKRELAY_OUTBOX_CLAIM_TTL_SECONDS: ${HOOKRELAY_OUTBOX_CLAIM_TTL_SECONDS:-60}
  HOOKRELAY_DELIVERY_WORKER_CONCURRENCY: ${HOOKRELAY_DELIVERY_WORKER_CONCURRENCY:-8}
  HOOKRELAY_DELIVERY_FETCH_TIMEOUT_SECONDS: ${HOOKRELAY_DELIVERY_FETCH_TIMEOUT_SECONDS:-1}
  HOOKRELAY_DELIVERY_HTTP_TIMEOUT_SECONDS: ${HOOKRELAY_DELIVERY_HTTP_TIMEOUT_SECONDS:-10}
  HOOKRELAY_DELIVERY_CLAIM_TTL_SECONDS: ${HOOKRELAY_DELIVERY_CLAIM_TTL_SECONDS:-20}
  HOOKRELAY_DELIVERY_FINALIZATION_MARGIN_SECONDS: ${HOOKRELAY_DELIVERY_FINALIZATION_MARGIN_SECONDS:-5}
  HOOKRELAY_DELIVERY_MAX_ATTEMPTS: ${HOOKRELAY_DELIVERY_MAX_ATTEMPTS:-5}
  HOOKRELAY_DELIVERY_RETRY_BASE_SECONDS: ${HOOKRELAY_DELIVERY_RETRY_BASE_SECONDS:-1}
  HOOKRELAY_DELIVERY_RETRY_MAX_SECONDS: ${HOOKRELAY_DELIVERY_RETRY_MAX_SECONDS:-60}
  HOOKRELAY_DELIVERY_RETRY_JITTER_RATIO: ${HOOKRELAY_DELIVERY_RETRY_JITTER_RATIO:-0.25}
  HOOKRELAY_DELIVERY_POLICY_BLOCK_DELAY_SECONDS: ${HOOKRELAY_DELIVERY_POLICY_BLOCK_DELAY_SECONDS:-30}
  HOOKRELAY_DELIVERY_DNS_TIMEOUT_SECONDS: ${HOOKRELAY_DELIVERY_DNS_TIMEOUT_SECONDS:-2}
  HOOKRELAY_DELIVERY_RATE_LIMIT_REQUESTS: ${HOOKRELAY_DELIVERY_RATE_LIMIT_REQUESTS:-10}
  HOOKRELAY_DELIVERY_RATE_LIMIT_WINDOW_SECONDS: ${HOOKRELAY_DELIVERY_RATE_LIMIT_WINDOW_SECONDS:-1}
  HOOKRELAY_DELIVERY_CIRCUIT_FAILURE_THRESHOLD: ${HOOKRELAY_DELIVERY_CIRCUIT_FAILURE_THRESHOLD:-5}
  HOOKRELAY_DELIVERY_CIRCUIT_COOLDOWN_SECONDS: ${HOOKRELAY_DELIVERY_CIRCUIT_COOLDOWN_SECONDS:-30}
  HOOKRELAY_DELIVERY_ALLOWED_HOSTS: '${HOOKRELAY_DELIVERY_ALLOWED_HOSTS:-["receiver","127.0.0.1","localhost"]}'

services:
  api:
    <<: *hookrelay-image
    # Build the shared application image once. The publisher, worker, and test
    # receiver reuse this tag, avoiding parallel exporters racing for one tag.
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *hookrelay-runtime-environment
      HOOKRELAY_HOST: 0.0.0.0
      HOOKRELAY_PORT: "8000"
      HOOKRELAY_BOOTSTRAP_ENABLED: ${HOOKRELAY_BOOTSTRAP_ENABLED:-true}
      HOOKRELAY_BOOTSTRAP_TOKEN: ${HOOKRELAY_BOOTSTRAP_TOKEN:-hookrelay-local-bootstrap-token-change-me}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    init: true
    stop_grace_period: 10s

  outbox-publisher:
    <<: *hookrelay-image
    command: ["hookrelay-outbox"]
    environment:
      <<: *hookrelay-runtime-environment
      HOOKRELAY_METRICS_HOST: 0.0.0.0
      HOOKRELAY_OUTBOX_METRICS_PORT: "9101"
    expose:
      - "9101"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      disable: true
    init: true
    stop_grace_period: 10s

  worker:
    <<: *hookrelay-image
    command: ["hookrelay-worker"]
    environment:
      <<: *hookrelay-runtime-environment
      HOOKRELAY_METRICS_HOST: 0.0.0.0
      HOOKRELAY_WORKER_METRICS_PORT: "9102"
    expose:
      - "9102"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      receiver:
        condition: service_healthy
    healthcheck:
      disable: true
    init: true
    # Default budget: up to 10s HTTP + 5s NATS drain + shutdown margin.
    stop_grace_period: 25s

  receiver:
    <<: *hookrelay-image
    command: ["hookrelay-test-receiver"]
    environment:
      HOOKRELAY_RECEIVER_HOST: 0.0.0.0
      HOOKRELAY_RECEIVER_PORT: "9000"
      HOOKRELAY_RECEIVER_RESPONSE_STATUS_CODE: ${HOOKRELAY_RECEIVER_RESPONSE_STATUS_CODE:-204}
      HOOKRELAY_RECEIVER_DELAY_SECONDS: ${HOOKRELAY_RECEIVER_DELAY_SECONDS:-0}
      HOOKRELAY_RECEIVER_MAX_CAPTURED_REQUESTS: ${HOOKRELAY_RECEIVER_MAX_CAPTURED_REQUESTS:-1000}
    ports:
      - "127.0.0.1:${RECEIVER_HOST_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health/live', timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    stop_grace_period: 10s

  postgres:
    # Keep the PostgreSQL patch and Debian suite explicit. Update this pin only
    # in a reviewed change accompanied by backup/restore and compatibility checks.
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hookrelay}
      POSTGRES_USER: ${POSTGRES_USER:-hookrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookrelay-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s

  nats:
    # Pin the exact NATS and Alpine releases; JetStream uses the named volume.
    image: nats:2.14.3-alpine3.22
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider 'http://127.0.0.1:8222/healthz?js-enabled-only=true'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    profiles: ["observability"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
    expose:
      - "4318"
      - "13133"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    stop_grace_period: 10s

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo.yaml"]
    profiles: ["observability"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4318"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - api
      - outbox-publisher
      - worker
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hookrelay-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  postgres_data:
  nats_data:
  prometheus_data:
  tempo_data:
  grafana_data:
