global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: hookrelay-api
    static_configs:
      - targets: [api:8000]
        labels:
          process_role: api
  - job_name: hookrelay-outbox
    static_configs:
      - targets: [outbox-publisher:9101]
        labels:
          process_role: outbox
  - job_name: hookrelay-worker
    static_configs:
      - targets: [worker:9102]
        labels:
          process_role: worker
